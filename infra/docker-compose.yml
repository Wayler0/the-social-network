# infra/docker-compose.yml — Hatua backing services for local development.
#
#   cd infra
#   cp .env.example .env          (then change every password)
#   docker compose up -d
#   docker compose run --rm migrate up
#   docker compose run --rm migrate seed-dev
#
# Every port is bound to 127.0.0.1 only. The API and web app services are
# added here once their source is in the repo. Production differences
# (HTTPS, no published database ports, backups) are listed in infra/README.md.

name: hatua

services:
  postgres:
    image: postgis/postgis:16-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot migration runner: `docker compose run --rm migrate <command>`.
  # Commands: up | status | seed-reference | seed-dev  (see db/migrate.sh).
  migrate:
    image: postgis/postgis:16-3.6
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - ../db:/db:ro
    entrypoint: ["bash", "/db/migrate.sh"]
    command: ["status"]

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for images. The app must talk to it through
  # the S3 API only, so this service can be swapped without code changes.
  # See infra/README.md "Object storage" — upstream MinIO no longer publishes
  # images, so this runs the maintained community build of MinIO.
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in infra/.env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in infra/.env}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # Creates the media bucket, then exits. Uses the plain AWS CLI so it works
  # against any S3-compatible store. Waits up to 60 s for storage to start.
  storage-init:
    image: amazon/aws-cli:2.40.1
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-hatua-media}
    entrypoint: ["sh", "-c"]
    command:
      - |
        i=0
        until aws --endpoint-url "$$S3_ENDPOINT" s3api list-buckets >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ "$$i" -ge 30 ]; then echo "object storage not reachable"; exit 1; fi
          sleep 2
        done
        if aws --endpoint-url "$$S3_ENDPOINT" s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null; then
          echo "bucket $$S3_BUCKET already exists"
        else
          aws --endpoint-url "$$S3_ENDPOINT" s3api create-bucket --bucket "$$S3_BUCKET"
          echo "bucket $$S3_BUCKET created"
        fi
    restart: "no"

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
