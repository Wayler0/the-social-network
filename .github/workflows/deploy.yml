# Continuous deployment: every commit on main that passes CI is deployed to the KENET server
# (docs/deploy.md, "Automatic deploys"). KENET doesn't let GitHub reach the server, so the server runs
# a GitHub runner that collects the work instead (it only makes outgoing HTTPS connections).
#
#   build  (GitHub's machines)  checks the commit is on main, builds the web app, packs a release
#   deploy (runner on the server, label hatua-deploy)  unpacks it and runs deploy/deploy.sh locally
#
# The server never runs npm or code from a pull request: it only receives a release built from main.
# Off until the team turns it on: repository variable DEPLOY_ENABLED=true (and APP_URL for the check).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag or branch on main to deploy (an older one rolls back). Default: main"
        required: false
        default: main

# One deploy at a time, in order; a deploy is never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the release
    # After CI: only a green run of a push to main (not a pull request that targets main).
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0

      - name: Only reviewed code (commits on main)
        run: |
          git fetch --quiet origin main
          COMMIT=$(git rev-parse --verify "HEAD^{commit}")
          git merge-base --is-ancestor "$COMMIT" origin/main \
            || { echo "::error::$REF ($COMMIT) is not on main. Only reviewed, merged code is deployed."; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: 22   # same as CI and deploy/api.Dockerfile
          cache: npm

      - name: Build the web app and pack the release
        id: release
        run: |
          COMMIT=$(git rev-parse HEAD)
          mkdir -p "$RUNNER_TEMP/release"
          git archive "$COMMIT" | tar -x -C "$RUNNER_TEMP/release"
          echo "$COMMIT" > "$RUNNER_TEMP/release/REVISION"
          (cd "$RUNNER_TEMP/release" && npm ci --no-audit --no-fund && npm run build -w apps/web)
          rm -rf "$RUNNER_TEMP/release/node_modules" "$RUNNER_TEMP/release"/apps/*/node_modules
          tar -czf release.tgz -C "$RUNNER_TEMP/release" .
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tgz
          retention-days: 7

  deploy:
    name: Deploy on the KENET server
    needs: build
    runs-on: [self-hosted, hatua-deploy]
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      # No checkout: the server gets only the release that "build" made from main.
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}

      - name: Unpack
        run: |
          rm -rf "$RUNNER_TEMP/release" && mkdir -p "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP/release.tgz" -C "$RUNNER_TEMP/release"
          test "$(cat "$RUNNER_TEMP/release/REVISION")" = "${{ needs.build.outputs.commit }}"

      - name: Deploy
        run: DEPLOY_HOST=local RELEASE_DIR="$RUNNER_TEMP/release" bash "$RUNNER_TEMP/release/deploy/deploy.sh"

      - name: Site answers
        if: vars.APP_URL != ''
        run: |
          for _ in $(seq 1 10); do
            curl -fsS "${{ vars.APP_URL }}/api/health" | grep -q '"db":"up"' && exit 0
            sleep 3
          done
          echo "::error::${{ vars.APP_URL }}/api/health did not answer with the database up"; exit 1

      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/release" "$RUNNER_TEMP/release.tgz"
