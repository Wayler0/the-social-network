# Hatua site for a server that already runs nginx for other sites (docs/deploy.md).
# Install:  sudo cp deploy/nginx/hatua.conf /etc/nginx/sites-available/hatua
#           sudo ln -s /etc/nginx/sites-available/hatua /etc/nginx/sites-enabled/hatua
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d hatua.nextup.co.ke --redirect   # adds HTTPS to this file
# If you change the domain, change server_name here and APP_URL in the server's .env.
# If API_PORT in .env is not 3000, change the port in the upstream below to match.

upstream hatua_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name hatua.nextup.co.ke;

    # The built web app (deploy/deploy.sh copies apps/web/dist here).
    root /var/www/hatua;
    index index.html;

    # 1 MB JSON is the API's own limit; image uploads get more (below).
    client_max_body_size 1m;

    # Browsers only honour HSTS over HTTPS, so this is harmless until certbot adds it.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://hatua_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # One proxy in front of the API: matches TRUST_PROXY_HOPS=1 (the default).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Image uploads: the API's own limit is IMAGE_MAX_BYTES (8 MB); allow a little extra for the form.
    location = /api/images {
        client_max_body_size 10m;
        proxy_pass http://hatua_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
    }

    # Uploaded images: the API checks the session (members only), so nginx must not cache them.
    location /media/ {
        proxy_pass http://hatua_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have content hashes in their names: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The app shell, manifest and any service worker must always be fresh, or users keep an old version.
    location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; }
    location = /sw.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }

    # Single-page app: every other path is a screen in the app.
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
