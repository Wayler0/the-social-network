<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="description" content="%APP_NAME%: %APP_TAGLINE%" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iPhone and iPad: home-screen icon, full-screen launch and the name under the icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <title>%APP_NAME%</title>
    <!-- Link previews (WhatsApp, Telegram, Facebook, X). The app is members-only, so every link gets
         the same card: never a post's text or photo (CLAUDE.md section 1). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%APP_NAME%" />
    <meta property="og:title" content="%APP_NAME%: %APP_TAGLINE%" />
    <meta property="og:description" content="Members only. Sign in with your campus email to see what's shared here." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%APP_NAME% logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
